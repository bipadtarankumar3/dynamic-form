services:
  mongo-server:
    image: mongo:7.0
    container_name: csrdynamicform-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=csrdynamicform_db

  mongo-client:
    image: mongo-express:latest
    container_name: csrdynamicform-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo-server:27017/
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo-server

volumes:
  mongo-data:
    name: csrdynamicform_mongo-data
